<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПАЗАРКО – Поръчка</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #2d7a3a;
    --green-light: #4caf50;
    --green-pale: #e8f5e9;
    --pink: #e91e8c;
    --pink-light: #fce4f3;
    --yellow: #ffc107;
    --yellow-light: #fff8e1;
    --orange: #ff9800;
    --bg: #f5faf5;
    --white: #ffffff;
    --text: #1a2e1a;
    --muted: #6b8f6b;
    --border: #c8e6c9;
    --radius: 18px;
    --shadow: 0 4px 24px rgba(45,122,58,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 60px 0;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, var(--green) 60%, #1b5e20 100%);
    color: white;
    padding: 28px 24px 22px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 180px; height: 180px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  .header .logo {
    font-size: 2.4rem;
    font-weight: 900;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .header .logo .cart { font-size: 2rem; }
  .header .tagline {
    font-family: 'Caveat', cursive;
    font-size: 1.3rem;
    color: #a5d6a7;
    margin-bottom: 2px;
  }
  .header .subtitle {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.7);
    margin-top: 4px;
  }

  /* PROGRESS BAR */
  .progress-wrap {
    background: white;
    padding: 16px 24px 0;
    border-bottom: 1px solid var(--border);
  }
  .steps {
    display: flex;
    gap: 0;
    max-width: 500px;
    margin: 0 auto;
  }
  .step {
    flex: 1;
    text-align: center;
    position: relative;
    padding-bottom: 12px;
  }
  .step::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%; right: -50%;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
  }
  .step.active::after { background: var(--green); }
  .step.done::after { background: var(--green-light); }
  .step-num {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--border);
    color: var(--muted);
    font-weight: 800;
    font-size: 0.9rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 4px;
    transition: all .3s;
  }
  .step.active .step-num { background: var(--green); color: white; }
  .step.done .step-num { background: var(--green-light); color: white; }
  .step-label { font-size: 0.7rem; color: var(--muted); font-weight: 700; }
  .step.active .step-label { color: var(--green); }

  /* MAIN */
  .main { max-width: 540px; margin: 0 auto; padding: 20px 16px 0; }

  /* CARDS */
  .card {
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 20px;
    margin-bottom: 18px;
    border: 1.5px solid var(--border);
    animation: fadeUp .35s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-title {
    font-size: 1rem;
    font-weight: 800;
    color: var(--green);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .icon { font-size: 1.2rem; }

  /* FORM ELEMENTS */
  label {
    display: block;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 5px;
    margin-top: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=tel], textarea, select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.97rem;
    color: var(--text);
    background: var(--green-pale);
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--green-light);
    box-shadow: 0 0 0 3px rgba(76,175,80,0.15);
    background: white;
  }
  textarea { resize: vertical; min-height: 90px; }

  /* DELIVERY TYPE */
  .delivery-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 4px;
  }
  .delivery-option {
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 14px 10px 12px;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
    position: relative;
    background: white;
  }
  .delivery-option:hover { border-color: var(--green-light); background: var(--green-pale); }
  .delivery-option.selected {
    border-color: var(--green);
    background: var(--green-pale);
    box-shadow: 0 2px 12px rgba(45,122,58,0.13);
  }
  .delivery-option input[type=radio] { display: none; }
  .del-icon { font-size: 1.6rem; margin-bottom: 4px; }
  .del-name { font-weight: 800; font-size: 0.92rem; color: var(--text); }
  .del-desc { font-size: 0.72rem; color: var(--muted); margin: 2px 0 6px; }
  .del-price {
    display: inline-block;
    background: var(--green);
    color: white;
    font-weight: 900;
    font-size: 1rem;
    border-radius: 20px;
    padding: 2px 14px;
  }
  .delivery-option.selected .del-price { background: var(--pink); }
  .check-badge {
    position: absolute;
    top: 8px; right: 8px;
    width: 20px; height: 20px;
    background: var(--green);
    border-radius: 50%;
    color: white;
    font-size: 0.75rem;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .delivery-option.selected .check-badge { display: flex; }

  /* EXTRA SERVICES */
  .extras { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .extra-item {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all .2s;
    background: white;
  }
  .extra-item:hover { border-color: var(--orange); background: var(--yellow-light); }
  .extra-item.checked { border-color: var(--orange); background: var(--yellow-light); }
  .extra-item input[type=checkbox] { display: none; }
  .extra-icon { font-size: 1.4rem; flex-shrink: 0; }
  .extra-info { flex: 1; }
  .extra-name { font-weight: 800; font-size: 0.92rem; }
  .extra-desc { font-size: 0.75rem; color: var(--muted); }
  .extra-price {
    font-weight: 900;
    color: var(--orange);
    font-size: 0.97rem;
    flex-shrink: 0;
  }
  .extra-check {
    width: 22px; height: 22px;
    border: 2px solid var(--border);
    border-radius: 6px;
    display: flex;
    align-items: center;
